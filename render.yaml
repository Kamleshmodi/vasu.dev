services:
  - type: web
    name: vasu-dev
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    preDeployCommand: "python manage.py migrate --noinput"
    startCommand: "gunicorn vasu.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-3} --log-file -"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
      - key: USE_HTTPS_SECURITY
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: DB_CONN_MAX_AGE
        value: "600"
      - key: DB_CONN_HEALTH_CHECKS
        value: "True"
      - key: ALLOWED_HOSTS
        value: "vasu-dev.onrender.com,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://vasu-dev.onrender.com"
      - key: WEB_CONCURRENCY
        value: "3"
      - key: SERVE_MEDIA_FILES
        value: "True"
      - key: GEMINI_CHAT_ENABLED
        value: "False"
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
